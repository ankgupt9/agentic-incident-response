# DRAFT written by Claude Code from the simulator's behavior, for Ankur to replace with experience-based content.
id: pricing-service
owner: ankur
last_reviewed: 2026-11-09
status: draft
purpose: Serves unit price quotes over HTTP and validates each order consumed from the orders queue against its price list.
depends_on: [rabbitmq]
depended_on_by: [order-service]
interfaces:
  http: ["GET /quote/{sku}"]
  consumes: ["orders queue"]
configuration:
  quote_cache_refresh: every 15 minutes
  consumer_prefetch: 1 message at a time
  rejected_messages: rejected without requeue, and there is no dead-letter queue
slo:
  consumer_error_rate: "under 20% over 1 minute; alert PricingConsumerErrorRateHigh fires after 30 seconds above that"
known_quirks:
  - Quotes come from a cache that refreshes on a timer, while the queue consumer validates against the live price list, so the two can disagree between refreshes.
  - A rejected order is dropped, not retried, so it is lost unless someone replays it.
escalation:
  ask: ankur
