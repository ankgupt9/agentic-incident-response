# Drafted from the code by Claude Code. Ankur: complete known_quirks and anything the code does not say, then set status: active.
id: pricing-service
owner: ankur
last_reviewed: 2026-11-09
status: draft
purpose: Serves unit price quotes over HTTP and validates each order consumed from the orders queue against its price list.
depends_on: [rabbitmq]
depended_on_by: [order-service]
interfaces:
  http: ["GET /quote/{sku}"]
  consumes: ["orders queue"]
configuration:
  consumer_prefetch: 1 message at a time
  rejected_messages: rejected without requeue, and there is no dead-letter queue
slo:
  consumer_error_rate: "under 20% over 1 minute; alert PricingConsumerErrorRateHigh fires after 30 seconds above that"
known_quirks: []
escalation:
  ask: ankur
