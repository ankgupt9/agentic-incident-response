# DRAFT written by Claude Code from the simulator's behavior, for Ankur to replace with experience-based content.
id: order-service
owner: ankur
last_reviewed: 2026-11-09
status: draft
purpose: Accepts orders over HTTP, asks pricing-service for a unit price, then publishes the order to the orders queue.
depends_on: [pricing-service, rabbitmq]
depended_on_by: []
interfaces:
  http: ["POST /orders"]
  publishes: ["orders queue"]
configuration:
  pricing_request_timeout: 5 seconds
  queue_delivery: persistent messages on a durable queue
slo:
  submit_error_rate: "under 20% over 1 minute; alert OrderSubmitErrorRateHigh fires after 30 seconds above that"
known_quirks:
  - A 502 from POST /orders means either the quote call or the publish step failed; the order-service log says which.
  - A quote slower than 5 seconds counts as a failure and returns 502.
escalation:
  ask: ankur
