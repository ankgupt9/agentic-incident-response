x-service: &service
  build:
    context: .
    dockerfile: services/Dockerfile
  environment: &service-env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ENABLE_FAULT_INJECTION: "true"
  depends_on:
    rabbitmq:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  # --- Simulated enterprise ---
  order-service:
    <<: *service
    command: uvicorn services.order_service.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *service-env
      PRICING_URL: http://pricing-service:8000
    ports: ["8001:8000"]

  pricing-service:
    <<: *service
    command: uvicorn services.pricing_service.main:app --host 0.0.0.0 --port 8000
    ports: ["8002:8000"]

  alert-receiver:
    <<: *service
    command: uvicorn services.alert_receiver.main:app --host 0.0.0.0 --port 8000
    ports: ["8003:8000"]

  rabbitmq:
    image: rabbitmq:4.0-management
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Observability ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [loki, tempo]

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo, alert-receiver]

  # --- Agent observability ---
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # POC only: no login on the local trace viewer. Production would enable auth and use API keys.
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix-data:/mnt/data
    ports: ["6006:6006"] # UI and OTLP/HTTP (/v1/traces); gRPC 4317 is not published (collector owns it)

volumes:
  phoenix-data:
